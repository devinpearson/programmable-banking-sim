  /za/v1/cards/{cardKey}/code/execute:
    post:
      tags:
        - Card code
      summary: Simulate a transaction against code you supply
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: cardKey
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currencyCode:
                  type: string
                  pattern: ^[A-Za-z]{3}$
                  example: ZAR
                centsAmount:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  example: 1000
                merchantCode:
                  type: string
                  pattern: ^\d{4}$
                  example: "5411"
                merchantName:
                  type: string
                  minLength: 1
                  example: Corner Cafe
                merchantCity:
                  type: string
                  minLength: 1
                  example: Cape Town
                countryCode:
                  type: string
                  pattern: ^[A-Za-z]{2}$
                  example: ZA
                simulationcode:
                  type: string
                  default: ""
                  description: The card code to run.
              required:
                - currencyCode
                - centsAmount
                - merchantCode
                - merchantName
                - merchantCity
                - countryCode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            executionId:
                              type: string
                            rootCodeFunctionId:
                              type: string
                            sandbox:
                              type: boolean
                            type:
                              type: string
                              enum: *a2
                            authorizationApproved:
                              type: boolean
                              nullable: true
                            smsCount:
                              type: integer
                            emailCount:
                              type: integer
                            pushNotificationCount:
                              type: integer
                            createdAt:
                              type: string
                              example: 2026-11-09T10:00:00.000Z
                            startedAt:
                              type: string
                              example: 2026-11-09T10:00:00.000Z
                            completedAt:
                              type: string
                              example: 2026-11-09T10:00:00.000Z
                            updatedAt:
                              type: string
                              nullable: true
                              example: 2026-11-09T10:00:00.000Z
                            logs:
                              type: array
                              items:
                                type: object
                                properties:
                                  logId:
                                    type: string
                                  executionId:
                                    type: string
                                  createdAt:
                                    type: string
                                    example: 2026-11-09T10:00:00.000Z
                                  level:
                                    type: string
                                  content:
                                    type: string
                                required:
                                  - createdAt
                                  - level
                                  - content
                          required:
                            - executionId
                            - rootCodeFunctionId
                            - sandbox
                            - type
                            - authorizationApproved
                            - smsCount
                            - emailCount
                            - pushNotificationCount
                            - createdAt
                            - startedAt
                            - completedAt
                            - updatedAt
                            - logs
                    required:
                      - result
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: http://localhost:3000/za/pb/v1/accounts
                    required:
                      - self
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 1
                    required:
                      - totalPages
                required:
                  - data
                  - links
                  - meta
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token lacks the scope or account consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
