          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConsentDetails"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: http://localhost:3000/za/pb/v1/accounts
                    required:
                      - self
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 1
                    required:
                      - totalPages
                required:
                  - data
                  - links
                  - meta
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /identity/approve:
    get:
      tags:
        - Identity
      summary: Approve a signed-in request
      security: []
      parameters:
        - schema:
            type: string
            description: The sign-in request handle
          required: true
          name: qsp
          in: query
        - schema:
            type: string
            description: JSON array of consented account numbers; omit for all.
          required: false
          name: selectedAccounts
          in: query
      responses:
        "302":
          description: To redirect_uri with code, status=SUCCESS and state
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /identity/decline:
    get:
      tags:
        - Identity
      summary: Decline a request
      security: []
      parameters:
        - schema:
            type: string
            description: The sign-in request handle
          required: true
          name: qsp
          in: query
      responses:
        "302":
          description: To redirect_uri with status=DECLINED and state
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /login:
    post:
      tags:
        - Identity
      summary: Sign in (the login page posts here)
      security: []
      x-sandbox-only: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  default: ""
                password:
                  type: string
                  default: ""
                qsp:
                  type: string
      responses:
        "302":
          description: To the web app's consent page, or back to login with
            error=invalid_credentials
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      tags:
        - Sandbox
      summary: Health check
      security: []
      x-sandbox-only: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /envs:
    get:
      tags:
        - Sandbox
      summary: Get settings
      security: []
      x-sandbox-only: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Settings"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: http://localhost:3000/za/pb/v1/accounts
                    required:
                      - self
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 1
                    required:
                      - totalPages
                required:
                  - data
                  - links
                  - meta
    post:
      tags:
        - Sandbox
      summary: Save settings
      security: []
      x-sandbox-only: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                api_key:
                  type: string
                token_expiry:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                auth:
                  anyOf:
                    - type: boolean
                    - type: string
                      enum: *a1
              required:
                - client_id
                - client_secret
                - api_key
                - token_expiry
                - auth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
