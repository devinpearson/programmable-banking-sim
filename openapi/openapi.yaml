openapi: 3.0.3
info:
  title: Programmable Banking Sandbox API
  version: 1.2.0
  description: A local sandbox emulating the Investec Programmable Banking APIs.
    Operations marked x-sandbox-only have no Investec equivalent.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An access token from POST /identity/v2/oauth2/token. Only required
        when the sandbox has auth turned on.
    clientCredentials:
      type: http
      scheme: basic
      description: client_id:client_secret
  schemas:
    Account:
      type: object
      properties:
        accountId:
          type: string
          example: "4675778129910189600000003"
        accountNumber:
          type: string
          example: "10012420003"
        accountName:
          type: string
          example: Mr J Soap
        referenceName:
          type: string
        productName:
          type: string
          example: Private Bank Account
        kycCompliant:
          type: boolean
        profileId:
          type: string
        profileName:
          type: string
      required:
        - accountId
        - accountNumber
        - accountName
        - referenceName
        - productName
        - kycCompliant
        - profileId
        - profileName
    Error:
      type: object
      properties:
        errorMessage:
          type: string
          example: Insufficient funds
        details:
          type: array
          items:
            type: object
            properties:
              location:
                type: string
                enum:
                  - params
                  - query
                  - body
              path:
                type: string
              message:
                type: string
            required:
              - location
              - path
              - message
          description: Every validation problem, for 400 responses.
      required:
        - errorMessage
      description: Most errors explain themselves; some (e.g. a plain 404) have an
        empty body.
    Balance:
      type: object
      properties:
        accountId:
          type: string
        currentBalance:
          type: number
          description: Posted transactions only.
          example: -35696.04
        availableBalance:
          type: number
          description: Current balance plus the overdraft limit, less pending card holds.
          example: 14303.96
        currency:
          type: string
          example: ZAR
      required:
        - accountId
        - currentBalance
        - availableBalance
        - currency
    Transaction:
      type: object
      properties:
        accountId:
          type: string
        type:
          type: string
          enum:
            - DEBIT
            - CREDIT
        transactionType:
          type: string
          example: CardPurchases
        status:
          type: string
          enum:
            - POSTED
            - PENDING
        description:
          type: string
        cardNumber:
          type: string
        postedOrder:
          anyOf:
            - type: string
              description: Decimal amount
              example: "125.50"
            - type: number
          description: 0 for pending transactions.
        postingDate:
          type: string
          description: Empty until a pending transaction settles.
        valueDate:
          type: string
        actionDate:
          type: string
        transactionDate:
          type: string
        amount:
          type: string
          description: Decimal amount
          example: "125.50"
        runningBalance:
          anyOf:
            - type: string
              description: Decimal amount
              example: "125.50"
            - type: number
          description: 0 for pending transactions.
      required:
        - accountId
        - type
        - transactionType
        - status
        - description
        - cardNumber
        - postedOrder
        - postingDate
        - valueDate
        - actionDate
        - transactionDate
        - amount
        - runningBalance
    StoredTransaction:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          properties:
            transactionId:
              type: integer
          required:
            - transactionId
    PendingTransaction:
      type: object
      properties:
        transactionId:
          type: integer
          description: Sandbox addition, for settling or reversing the hold.
        accountId:
          type: string
        type:
          type: string
          enum:
            - DEBIT
            - CREDIT
        transactionType:
          type: string
        status:
          type: string
          enum:
            - PENDING
        description:
          type: string
        cardNumber:
          type: string
        transactionDate:
          type: string
        amount:
          type: string
          description: Decimal amount
          example: "125.50"
      required:
        - transactionId
        - accountId
        - type
        - transactionType
        - status
        - description
        - cardNumber
        - transactionDate
        - amount
    TransferLeg:
      type: object
      properties:
        beneficiaryAccountId:
          type: string
        amount:
          type: number
        myReference:
          type: string
        theirReference:
          type: string
      required:
        - beneficiaryAccountId
        - amount
        - myReference
        - theirReference
    PaymentLeg:
      type: object
      properties:
        beneficiaryId:
          type: string
        amount:
          type: number
        myReference:
          type: string
        theirReference:
          type: string
      required:
        - beneficiaryId
        - amount
        - myReference
        - theirReference
    Beneficiary:
      type: object
      properties:
        beneficiaryId:
          type: string
        accountNumber:
          type: string
        code:
          type: string
        bank:
          type: string
        beneficiaryName:
          type: string
        lastPaymentAmount:
          type: string
          example: 2,000.00
        lastPaymentDate:
          type: string
          example: 25/04/2023
        cellNo:
          type: string
          nullable: true
        emailAddress:
          type: string
          nullable: true
        name:
          type: string
        referenceAccountNumber:
          type: string
        referenceName:
          type: string
        categoryId:
          type: string
        profileId:
          type: string
      required:
        - beneficiaryId
        - accountNumber
        - code
        - bank
        - beneficiaryName
        - lastPaymentAmount
        - lastPaymentDate
        - cellNo
        - emailAddress
        - name
        - referenceAccountNumber
        - referenceName
        - categoryId
        - profileId
    BeneficiaryCategory:
      type: object
      properties:
        categoryId:
          type: string
        isDefault:
          type: boolean
        name:
          type: string
      required:
        - categoryId
        - isDefault
        - name
    DocumentSummary:
      type: object
      properties:
        documentType:
          type: string
        documentDate:
          type: string
        description:
          type: string
      required:
        - documentType
        - documentDate
        - description
    DocumentDetail:
      type: object
      properties:
        accountId:
          type: string
        documentType:
          type: string
        documentDate:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        note:
          type: string
      required:
        - accountId
        - documentType
        - documentDate
        - fileName
        - mimeType
        - note
    Card:
      type: object
      properties:
        CardKey:
          type: string
          example: "700615"
        CardNumber:
          type: string
          example: 402167XXXXXX1111
        IsProgrammable:
          type: boolean
        status:
          type: string
          example: Active
        CardTypeCode:
          type: string
        AccountNumber:
          type: string
        AccountId:
          type: string
      required:
        - CardKey
        - CardNumber
        - IsProgrammable
        - status
        - CardTypeCode
        - AccountNumber
        - AccountId
    CreatedCard:
      type: object
      properties:
        cardKey:
          type: string
        cardNumber:
          type: string
        isProgrammable:
          type: boolean
        status:
          type: string
        cardTypeCode:
          type: string
        accountId:
          type: string
        accountNumber:
          type: string
        publishedCode:
          type: string
        savedCode:
          type: string
        envs:
          type: string
      required:
        - cardKey
        - cardNumber
        - isProgrammable
        - status
        - cardTypeCode
        - accountId
        - accountNumber
        - publishedCode
        - savedCode
        - envs
    CardCode:
      type: object
      properties:
        cardCode:
          type: object
          properties:
            codeId:
              type: string
            code:
              type: string
            createdAt:
              type: string
              example: 2026-11-09T10:00:00.000Z
            updatedAt:
              type: string
              example: 2026-11-09T10:00:00.000Z
            publishedAt:
              type: string
              nullable: true
              example: 2026-11-09T10:00:00.000Z
          required:
            - codeId
            - code
            - createdAt
            - updatedAt
            - publishedAt
      required:
        - cardCode
    EnvironmentVariables:
      type: object
      properties:
        result:
          type: object
          properties:
            variables:
              type: object
              additionalProperties:
                nullable: true
            createdAt:
              type: string
              example: 2026-11-09T10:00:00.000Z
            updatedAt:
              type: string
              example: 2026-11-09T10:00:00.000Z
            error:
              nullable: true
          required:
            - variables
            - createdAt
            - updatedAt
            - error
      required:
        - result
    SwipeResult:
      type: object
      properties:
        result:
          type: boolean
          description: Whether the purchase was approved.
        reason:
          type: string
          enum:
            - insufficient_funds
            - card_not_active
          description: Why the bank declined it, before any card code ran.
        transaction:
          allOf:
            - $ref: "#/components/schemas/StoredTransaction"
            - allOf:
                - $ref: "#/components/schemas/Transaction"
                - type: object
                  nullable: true
                  properties:
                    transactionId:
                      type: integer
                  required:
                    - transactionId
              description: The pending hold (or posted purchase) on the card's account; null
                when declined or the card has no account.
      required:
        - result
        - transaction
    Execution:
      type: object
      properties:
        executionId:
          type: string
        cardKey:
          type: string
        rootCodeFunctionId:
          type: string
        sandbox:
          type: boolean
        type:
          type: string
          enum: &a2
            - before_transaction
            - after_transaction
            - after_decline
        authorizationApproved:
          type: boolean
          nullable: true
        smsCount:
          type: integer
        emailCount:
          type: integer
        pushNotificationCount:
          type: integer
        createdAt:
          type: string
          example: 2026-11-09T10:00:00.000Z
        startedAt:
          type: string
          example: 2026-11-09T10:00:00.000Z
        completedAt:
          type: string
          example: 2026-11-09T10:00:00.000Z
        updatedAt:
          type: string
          nullable: true
          example: 2026-11-09T10:00:00.000Z
        logs:
          type: array
          items:
            type: object
            properties:
              logId:
                type: string
              executionId:
                type: string
              createdAt:
                type: string
                example: 2026-11-09T10:00:00.000Z
              level:
                type: string
              content:
                type: string
            required:
              - createdAt
              - level
              - content
      required:
        - executionId
        - rootCodeFunctionId
        - sandbox
        - type
        - authorizationApproved
        - smsCount
        - emailCount
        - pushNotificationCount
        - createdAt
        - startedAt
        - completedAt
        - updatedAt
        - logs
    ReferenceList:
      type: object
      properties:
        result:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
            required:
              - code
              - name
      required:
        - result
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
        scope:
          type: string
          example: accounts balances transactions
        refresh_token:
          type: string
          description: For authorization_code and refresh_token grants.
      required:
        - access_token
        - token_type
        - expires_in
        - scope
    TokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
            - authorization_code
            - refresh_token
        code:
          type: string
          description: authorization_code grant
        redirect_uri:
          type: string
          description: authorization_code grant; must match /authorize
        refresh_token:
          type: string
          description: refresh_token grant
      required:
        - grant_type
    ConsentDetails:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: object
            properties:
              scope:
                type: string
              description:
                type: string
            required:
              - scope
              - description
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
              accountNumber:
                type: string
              accountName:
                type: string
              productName:
                type: string
            required:
              - accountId
              - accountNumber
              - accountName
              - productName
      required:
        - scopes
        - accounts
    Settings:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        api_key:
          type: string
        token_expiry:
          type: integer
          description: Seconds
        auth:
          type: boolean
          description: Whether /za routes require a bearer token.
      required:
        - client_id
        - client_secret
        - api_key
        - token_expiry
        - auth
    DatabaseSummary:
      type: object
      properties:
        profiles:
          type: integer
        accounts:
          type: integer
        cards:
          type: integer
        transactions:
          type: integer
      required:
        - profiles
        - accounts
        - cards
        - transactions
    Scenario:
      type: object
      properties:
        id:
          type: string
          example: hackathon
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - description
    ScenarioLoaded:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        accounts:
          type: integer
        beneficiaries:
          type: integer
        cards:
          type: integer
      required:
        - id
        - name
        - accounts
        - beneficiaries
        - cards
  parameters: {}
paths:
  /za/pb/v1/accounts:
    get:
      tags:
        - Accounts
      summary: List accounts
      description: A 3-legged token sees only the accounts the user consented to.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accounts:
                        type: array
                        items:
                          $ref: "#/components/schemas/Account"
                    required:
                      - accounts
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: http://localhost:3000/za/pb/v1/accounts
                    required:
                      - self
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 1
                    required:
                      - totalPages
                required:
                  - data
                  - links
                  - meta
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token lacks the scope or account consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Accounts
      summary: Create an account
      security:
        - bearerAuth: []
      x-sandbox-only: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  minLength: 1
                accountNumber:
                  type: string
                  minLength: 1
                accountName:
                  type: string
                  minLength: 1
                referenceName:
                  type: string
                  minLength: 1
                productName:
                  type: string
                  minLength: 1
                kycCompliant:
                  type: boolean
                profileId:
                  type: string
                  minLength: 1
                profileName:
                  type: string
                  minLength: 1
                overdraftLimit:
                  type: number
                  minimum: 0
                  description: How far below zero the account may go.
              additionalProperties: false
              description: Fields left out get random values; the account joins the first
                profile.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: http://localhost:3000/za/pb/v1/accounts
                    required:
                      - self
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 1
                    required:
                      - totalPages
                required:
                  - data
                  - links
                  - meta
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token lacks the scope or account consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not possible in the current state (e.g. insufficient funds)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /za/pb/v1/accounts/{accountId}:
    delete:
      tags:
        - Accounts
      summary: Delete an account with its transactions and cards
      security:
        - bearerAuth: []
      x-sandbox-only: true
      parameters:
        - schema:
            type: string
          required: true
          name: accountId
          in: path
      responses:
        "200":
          description: OK (empty body)
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token lacks the scope or account consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /za/pb/v1/accounts/{accountId}/balance:
    get:
      tags:
        - Accounts
      summary: Get the balance
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: accountId
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Balance"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: http://localhost:3000/za/pb/v1/accounts
                    required:
                      - self
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 1
                    required:
                      - totalPages
                required:
                  - data
                  - links
                  - meta
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token lacks the scope or account consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /za/pb/v1/accounts/{accountId}/transactions:
    get:
      tags:
        - Transactions
      summary: List transactions, newest first
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: accountId
          in: path
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Earliest posting date. Defaults to 180 days ago.
            example: 2026-01-31
          required: false
          name: fromDate
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Latest posting date. Defaults to today.
            example: 2026-01-31
          required: false
          name: toDate
          in: query
        - schema:
            type: string
            minLength: 1
            example: CardPurchases
          required: false
          name: transactionType
          in: query
        - schema:
            type: string
            enum: &a1
              - "true"
              - "false"
            description: Include pending card holds (listed first).
          required: false
          name: includePending
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          $ref: "#/components/schemas/Transaction"
                    required:
                      - transactions
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: http://localhost:3000/za/pb/v1/accounts
                    required:
                      - self
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 1
                    required:
                      - totalPages
                required:
                  - data
                  - links
                  - meta
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token lacks the scope or account consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Transactions
      summary: Create a transaction
      description: Only card transactions (CardPurchases, CardWithdrawals) may be
        PENDING unless allowNonCardPending=true.
      security:
        - bearerAuth: []
      x-sandbox-only: true
      parameters:
        - schema:
            type: string
          required: true
          name: accountId
          in: path
        - schema:
            type: string
            enum: *a1
            description: Allow a non-card transaction to be created as PENDING.
          required: false
          name: allowNonCardPending
          in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - DEBIT
                    - CREDIT
                transactionType:
                  type: string
                  minLength: 1
                status:
                  type: string
                  enum:
                    - POSTED
                    - PENDING
                description:
                  type: string
                cardNumber:
                  type: string
                postingDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  example: 2026-01-31
                valueDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  example: 2026-01-31
                actionDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  example: 2026-01-31
                transactionDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  example: 2026-01-31
                amount:
                  type: number
                  example: 125.5
              additionalProperties: false
              description: Fields left out get random values.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StoredTransaction"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: http://localhost:3000/za/pb/v1/accounts
                    required:
                      - self
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 1
                    required:
                      - totalPages
                required:
                  - data
                  - links
                  - meta
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or expired token (when auth is on)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token lacks the scope or account consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
